openapi: 3.0.3
info:
  title: Email Service API - Health Check
  description: Pings the upstream SMTP server to confirm connectivity and health status.
  version: 1.0.0
paths:
  /health-check:
    get:
      summary: Health check endpoint
      description: Pings the upstream SMTP server to confirm connectivity and health status.
      responses:
        '200':
          description: Service is healthy and SMTP connectivity is successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          description: Method Not Allowed
        '503':
          description: Service is unhealthy (SMTP server is unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          description: The health status ('healthy' or 'unhealthy')
          example: healthy
      required:
        - status
